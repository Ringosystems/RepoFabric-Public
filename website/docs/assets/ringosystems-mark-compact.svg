<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RingoSystems">
  <title>RingoSystems</title>
  <!--
    Compact build of the RingoSystems mark, for 16-48px (favicon, topbar). RingoSystems Heavy Industries.

    Replaces the earlier placeholder "R" tile now that the real identity exists.
    Reduced again from ringosystems-mark.svg: 3 leads per side, no ring pads, no
    blur filter, thicker strokes. At 16px the full mark collapses into a grey
    smudge, so detail is REMOVED rather than scaled — the recognisable silhouette
    is the copper lead frame plus the lit cyan die, and that is all this keeps.
    Colours are unchanged from the source artwork.
  -->
  <defs>
    <linearGradient id="f-pkg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A424C"/><stop offset="1" stop-color="#23282F"/>
    </linearGradient>
    <linearGradient id="f-cu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2A472"/><stop offset="1" stop-color="#A2612F"/>
    </linearGradient>
    <radialGradient id="f-die" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#EAFBFF"/><stop offset=".28" stop-color="#5CD2EC"/>
      <stop offset=".68" stop-color="#1487CE"/><stop offset="1" stop-color="#0A4A87"/>
    </radialGradient>
  </defs>
  <g stroke="url(#f-cu)" stroke-width="4.5" stroke-linecap="round">
    <path d="M22 15V5"/><path d="M32 15V2"/><path d="M42 15V5"/>
    <path d="M22 49v10"/><path d="M32 49v13"/><path d="M42 49v10"/>
    <path d="M15 22H5"/><path d="M15 32H2"/><path d="M15 42H5"/>
    <path d="M49 22h10"/><path d="M49 32h13"/><path d="M49 42h10"/>
  </g>
  <rect x="12" y="12" width="40" height="40" rx="6" fill="url(#f-pkg)" stroke="#525A64" stroke-width="1.5"/>
  <rect x="19" y="19" width="26" height="26" rx="3.5" fill="none" stroke="#B6BFC8" stroke-width="3"/>
  <rect x="22" y="22" width="20" height="20" rx="2" fill="url(#f-die)"/>
  <circle cx="32" cy="32" r="3" fill="#F2FEFF" fill-opacity=".95"/>
</svg>
